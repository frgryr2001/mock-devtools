<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mock DevTools</title>
    <style>
      :root {
        color: #1d1d1f;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif;
        font-size: 15px;
      }

      body {
        margin: 0;
        width: 320px;
        background: #f5f5f7;
      }

      main {
        display: grid;
        gap: 16px;
        padding: 18px;
      }

      h1,
      p {
        margin: 0;
      }

      h1 {
        font-size: 22px;
        letter-spacing: -0.28px;
        line-height: 1.1;
      }

      p {
        color: #6e6e73;
        line-height: 1.4;
      }

      button {
        min-height: 44px;
        border: 1px solid #0066cc;
        border-radius: 9999px;
        background: #0066cc;
        color: white;
        cursor: pointer;
        font: inherit;
      }

      button[data-enabled="true"] {
        background: white;
        color: #0066cc;
      }

      button:disabled {
        border-color: #d2d2d7;
        background: #fafafc;
        color: #7a7a7a;
        cursor: not-allowed;
      }

      .origin {
        overflow-wrap: anywhere;
      }
    </style>
  </head>
  <body>
    <main>
      <div>
        <p>Mock DevTools</p>
        <h1>Site access</h1>
      </div>
      <p class="origin" id="origin">Loading current tab...</p>
      <button id="toggle" type="button" disabled>Enable this site</button>
      <p id="status"></p>
    </main>
    <script type="module" src="./popup.js"></script>
  </body>
</html>
